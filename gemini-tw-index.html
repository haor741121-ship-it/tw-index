<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-title" content="台股戰情 Gemini 版" />
  <title>台股指數｜Gemini 獨立版</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" data-keep></script>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --up: #dc2626;
      --down: #16a34a;
      --accent: #0f766e;
      --accent-fill: rgba(15, 118, 110, 0.10);
      --twd-idx: #ea580c;
      --tag-bg: #ccfbf1;
      --soft-bg: #f8fafc;
    }
    body.dark {
      --bg: #0b1117;
      --card: #131c26;
      --text: #f9fafb;
      --muted: #9ca3af;
      --border: #243242;
      --up: #f87171;
      --down: #4ade80;
      --accent: #2dd4bf;
      --accent-fill: rgba(45, 212, 191, 0.12);
      --twd-idx: #fb923c;
      --tag-bg: #134e4a;
      --soft-bg: #192432;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 12px 14px 44px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    button.dl {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-block;
      background: var(--tag-bg);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 12px;
      color: var(--muted);
    }
    .main-num {
      font-size: 28px;
      font-weight: 800;
      margin: 4px 0;
    }
    .up { color: var(--up); font-weight: 700; }
    .down { color: var(--down); font-weight: 700; }
    .flat { color: var(--muted); font-weight: 700; }
    .title {
      font-size: 14px;
      font-weight: 800;
      margin: 0 0 6px;
    }
    .chart-wrap {
      position: relative;
      height: 240px;
      width: 100%;
      margin-top: 6px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 6px;
    }
    .stat-box {
      background: var(--soft-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
    }
    .stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .stat-val {
      font-size: 14px;
      font-weight: 800;
      word-break: break-word;
    }
    .stat-chg {
      font-size: 11px;
      margin-top: 2px;
    }
    .row-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      gap: 8px;
    }
    .row-item:last-child { border-bottom: none; }
    .win-box {
      background: var(--soft-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
      margin-bottom: 8px;
    }
    .win-box:last-of-type { margin-bottom: 0; }
    .win-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 3px;
    }
    .win-pct {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>台股指數（Gemini 版）</h1>
      <div class="btn-group">
        <button id="refreshBtn" type="button">重新整理</button>
        <button id="modeBtn" type="button">深色</button>
        <button id="saveBtn" class="dl" type="button">下載離線檔</button>

    <section class="card">
      <span class="badge">獨立並行版</span>
      <div class="sub" id="metaLine">更新：—｜基準日：—</div>
      <div class="main-num" id="idxVal">—</div>
      <div id="idxDiff" class="flat">—</div>
      <div class="sub" id="statusNote" style="margin-top:6px;"></div>
    </section>

    <section class="card">
      <div class="title">近 10 日加權指數 × 台幣指數</div>
      <div class="sub" id="chartMeta">左軸：加權指數（點）｜右副軸：台幣指數（基期 32.50=100）</div>
      <div class="chart-wrap">
        <canvas id="dualAxisChart"></canvas>
      </div>
      <div class="sub" id="chartNote" style="margin-top:6px;"></div>
    </section>

    <section class="card">
      <div class="title" id="marginTitle">融資融券餘額與融資維持率</div>
      <div class="sub" id="marginMeta"></div>
      <div class="grid-3">
        <div class="stat-box">
          <div class="stat-label">融資餘額</div>
          <div class="stat-val" id="marginBal">—</div>
          <div class="stat-chg" id="marginBalChg">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">融券餘額</div>
          <div class="stat-val" id="shortBal">—</div>
          <div class="stat-chg" id="shortBalChg">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">融資維持率</div>
          <div class="stat-val" id="marginRatio">—</div>
          <div class="stat-chg" id="marginRatioNote">—</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="title" id="usTitle">美股與夜盤重點</div>
      <div id="usList"></div>
      <div class="sub" id="nightNote" style="margin-top:6px;"></div>
    </section>

    <section class="card">
      <div class="title">現在買進勝率（持有 20 個交易日）</div>
      <div class="sub" id="winMeta" style="margin-bottom:8px;"></div>
      <div id="winList"></div>
      <div class="sub" id="winNote" style="margin-top:8px;"></div>
    </section>
  </div>

  <script data-keep>
    (function () {
      const CNYES_QUOTE_URL = "https://ws.api.cnyes.com/ws/api/v1/quote/quotes/TWS:TSE01:INDEX,FX:USD:TWD";
      const TWD_FX_BASE = 32.5;
      const metaLine = document.getElementById("metaLine");
      const idxVal = document.getElementById("idxVal");
      const idxDiff = document.getElementById("idxDiff");
      const statusNote = document.getElementById("statusNote");
      const chartNote = document.getElementById("chartNote");
      const marginMeta = document.getElementById("marginMeta");
      const marginBal = document.getElementById("marginBal");
      const marginBalChg = document.getElementById("marginBalChg");
      const shortBal = document.getElementById("shortBal");
      const shortBalChg = document.getElementById("shortBalChg");
      const marginRatio = document.getElementById("marginRatio");
      const marginRatioNote = document.getElementById("marginRatioNote");
      const usTitle = document.getElementById("usTitle");
      const usList = document.getElementById("usList");
      const nightNote = document.getElementById("nightNote");
      const winMeta = document.getElementById("winMeta");
      const winList = document.getElementById("winList");
      const winNote = document.getElementById("winNote");
      const refreshBtn = document.getElementById("refreshBtn");
      const modeBtn = document.getElementById("modeBtn");

      let currentUpdated = "—";
      let baseStatusNote = "";
      let latestHistory10d = [];
      let dualChart = null;

      function formatClock(d = new Date()) {
        const hh = String(d.getHours()).padStart(2, "0");
        const mm = String(d.getMinutes()).padStart(2, "0");
        const ss = String(d.getSeconds()).padStart(2, "0");
        return `${hh}:${mm}:${ss}`;
      }

      function calcTwdIndex(usdTwdRate) {
        const fx = Number(usdTwdRate);
        if (!Number.isFinite(fx) || fx <= 0) return null;
        return Number(((TWD_FX_BASE / fx) * 100).toFixed(2));
      }

      function chgClass(str) {
        if (!str || typeof str !== "string") return "flat";
        const s = str.trim();
        if (s.startsWith("+") || s.includes("增")) return "up";
        if (s.startsWith("-") || s.includes("減")) return "down";
        return "flat";
      }

      function getCssVar(name) {
        return getComputedStyle(document.body).getPropertyValue(name).trim();
      }

      function renderDualChart(rows) {
        const canvas = document.getElementById("dualAxisChart");
        if (!canvas || typeof Chart === "undefined") return;

        const sliced = Array.isArray(rows) ? rows.slice(-10) : [];
        const labels = sliced.map((r) => r.date || "—");
        const taiexSeries = sliced.map((r) => {
          const n = Number(r.taiex);
          return Number.isFinite(n) ? n : null;
        });
        const twdIdxSeries = sliced.map((r) => {
          const direct = Number(r.twdIndex);
          if (Number.isFinite(direct)) return direct;
          return calcTwdIndex(r.usdTwd);
        });

        const textMuted = getCssVar("--muted") || "#6b7280";
        const borderCol = getCssVar("--border") || "#e5e7eb";
        const idxCol = getCssVar("--accent") || "#0f766e";
        const idxFill = getCssVar("--accent-fill") || "rgba(15, 118, 110, 0.10)";
        const twdCol = getCssVar("--twd-idx") || "#ea580c";

        if (dualChart) {
          dualChart.destroy();
          dualChart = null;
        }

        dualChart = new Chart(canvas.getContext("2d"), {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "加權指數（點）",
                data: taiexSeries,
                yAxisID: "y",
                borderColor: idxCol,
                backgroundColor: idxFill,
                fill: true,
                borderWidth: 2.2,
                pointRadius: 3,
                pointHoverRadius: 5,
                tension: 0.3,
                spanGaps: true
              },
              {
                label: "台幣指數",
                data: twdIdxSeries,
                yAxisID: "y1",
                borderColor: twdCol,
                backgroundColor: twdCol,
                fill: false,
                borderWidth: 2,
                borderDash: [5, 3],
                pointRadius: 3,
                pointStyle: "circle",
                pointHoverRadius: 5,
                tension: 0.3,
                spanGaps: true
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            plugins: {
              legend: {
                position: "top",
                labels: { color: textMuted, boxWidth: 14, usePointStyle: true, font: { size: 11, weight: "bold" } }
              },
              tooltip: {
                callbacks: {
                  label: (ctx) => {
                    const v = ctx.parsed.y;
                    if (v === null || v === undefined || Number.isNaN(v)) return `${ctx.dataset.label}：—`;
                    return ctx.dataset.yAxisID === "y1"
                      ? `${ctx.dataset.label}：${Number(v).toFixed(2)}`
                      : `${ctx.dataset.label}：${Number(v).toLocaleString("en-US", { maximumFractionDigits: 2 })} 點`;
                  }
                }
              }
            },
            scales: {
              x: {
                ticks: { color: textMuted, font: { size: 10 }, maxRotation: 0 },
                grid: { color: borderCol, drawBorder: false }
              },
              y: {
                type: "linear",
                position: "left",
                ticks: { color: idxCol, font: { size: 10 } },
                grid: { color: borderCol, drawBorder: false }
              },
              y1: {
                type: "linear",
                position: "right",
                ticks: {
                  color: twdCol,
                  font: { size: 10 },
                  callback: (val) => Number(val).toFixed(2)
                },
                grid: { drawOnChartArea: false, drawBorder: false }
              }
            }
          }
        });
      }

      function applyTaiex(updatedText, tradeDateText, closeVal, prevVal, extraTag = "") {
        currentUpdated = updatedText || "—";
        metaLine.textContent = `更新：${currentUpdated}｜基準日：${tradeDateText || "—"}${extraTag}`;

        const closeNum = Number(closeVal);
        const prevNum = Number(prevVal);

        if (Number.isFinite(closeNum)) {
          idxVal.textContent = closeNum.toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          });
        } else {
          idxVal.textContent = "—";
        }

        if (Number.isFinite(closeNum) && Number.isFinite(prevNum) && prevNum !== 0) {
          const diff = closeNum - prevNum;
          const pct = (diff / prevNum) * 100;
          const sign = diff > 0 ? "+" : "";
          idxDiff.textContent = `${sign}${diff.toFixed(2)} (${sign}${pct.toFixed(2)}%)`;
          idxDiff.className = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
        } else {
          idxDiff.textContent = "—";
          idxDiff.className = "flat";
        }
      }

      function renderMargin(m) {
        const data = m && typeof m === "object" ? m : {};
        marginMeta.textContent = data.date ? `資料日期：${data.date}（上市信用交易）` : "上市信用交易";

        const mBal = Number(data.marginBalance);
        marginBal.textContent = Number.isFinite(mBal) ? `${mBal.toLocaleString("en-US")} 億` : "—";
        const mChgText = data.marginBalanceChg ? `增減 ${data.marginBalanceChg}` : "增減 —";
        marginBalChg.textContent = mChgText;
        marginBalChg.className = `stat-chg ${chgClass(data.marginBalanceChg)}`;

        const sBal = Number(data.shortBalance);
        shortBal.textContent = Number.isFinite(sBal) ? `${sBal.toLocaleString("en-US")} 張` : "—";
        const sChgText = data.shortBalanceChg ? `增減 ${data.shortBalanceChg}` : "增減 —";
        shortBalChg.textContent = sChgText;
        shortBalChg.className = `stat-chg ${chgClass(data.shortBalanceChg)}`;

        const ratioNum = Number(data.maintenanceRatio);
        marginRatio.textContent = Number.isFinite(ratioNum) ? `${ratioNum.toFixed(2)}%` : "—";
        marginRatioNote.textContent = data.thresholdNote || "追繳門檻 120%";
        marginRatioNote.className = "stat-chg flat";
      }

      function renderSections(snap) {
        baseStatusNote = snap.statusNote || "";
        statusNote.textContent = baseStatusNote;

        latestHistory10d = Array.isArray(snap.history10d) ? snap.history10d.slice(-10) : [];
        chartNote.textContent = snap.chartNote || "往回朔 10 個交易日；左軸為加權指數，右副軸為台幣指數。";
        renderDualChart(latestHistory10d);

        renderMargin(snap.margin);

        usTitle.textContent = snap.usTitle || "美股與夜盤重點";
        usList.innerHTML = "";
        const usItems = Array.isArray(snap.us) ? snap.us : [];
        usItems.forEach((item) => {
          const div = document.createElement("div");
          div.className = "row-item";
          const cls = item.dir === "up" ? "up" : item.dir === "down" ? "down" : "flat";
          div.innerHTML = `<span>${item.name || "—"}</span><span class="${cls}">${item.value || "—"}</span>`;
          usList.appendChild(div);
        });
        nightNote.textContent = snap.nightNote || "";

        winMeta.textContent = snap.winMeta || "";
        winList.innerHTML = "";
        const winItems = Array.isArray(snap.win) ? snap.win : [];
        winItems.forEach((w) => {
          const box = document.createElement("div");
          box.className = "win-box";
          const rateText = (w.winRate === null || w.winRate === undefined || w.winRate === "")
            ? "待更新"
            : `勝率 ${Number(w.winRate).toFixed(1)}%`;
          box.innerHTML = `
            <div class="win-top">
              <strong>${w.code || "—"}</strong>
              <span class="win-pct">${rateText}</span>
            </div>
            <div class="sub">${w.range || "—"}</div>
            <div class="sub" style="margin-top:2px;">${w.desc || ""}</div>
          `;
          winList.appendChild(box);
        });
        winNote.textContent = snap.winNote || "統計推估僅供參考，未含交易成本與稅，不構成投資建議。";
      }

      function renderFromSnapshot(extraTag = "") {
        const snapEl = document.getElementById("gemini-snapshot");
        const snap = snapEl ? JSON.parse(snapEl.textContent) : {};
        renderSections(snap);
        applyTaiex(snap.updated, snap.tradeDate, snap.taiexClose, snap.taiexPrev, extraTag);
      }

      async function fetchLiveCnyes(timeoutMs = 6000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const res = await fetch(`${CNYES_QUOTE_URL}&_=${Date.now()}`, {
            signal: controller.signal,
            cache: "no-store"
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          const dataArr = Array.isArray(json.data) ? json.data : [];
          const row = dataArr.find((item) => item && item["0"] === "TWS:TSE01:INDEX");
          const fxRow = dataArr.find((item) => item && item["0"] === "FX:USD:TWD");
          if (!row) throw new Error("查無 TWS:TSE01:INDEX 報價");

          const livePrice = Number(row["6"]);
          const prevClose = Number(row["21"]);
          const liveFx = fxRow ? Number(fxRow["6"]) : NaN;
          const liveTwdIdx = calcTwdIndex(liveFx);
          const tickSec = Number(row["200007"]);
          if (!Number.isFinite(livePrice) || !Number.isFinite(prevClose)) {
            throw new Error("報價欄位非數值");
          }

          let quoteTimeStr = formatClock();
          if (Number.isFinite(tickSec) && tickSec > 0) {
            const d = new Date(tickSec * 1000);
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, "0");
            const dd = String(d.getDate()).padStart(2, "0");
            quoteTimeStr = `${yyyy}-${mm}-${dd} ${formatClock(d)}`;
          }

          const twdTag = Number.isFinite(liveTwdIdx) ? `｜台幣指數 ${liveTwdIdx.toFixed(2)}` : "";
          applyTaiex(quoteTimeStr, "即時報價", livePrice, prevClose, `（鉅亨網即時 ${formatClock()}${twdTag}）`);
          if (latestHistory10d.length > 0) {
            const updatedRows = latestHistory10d.map((item, idx) => {
              if (idx !== latestHistory10d.length - 1) return item;
              return {
                ...item,
                taiex: livePrice,
                twdIndex: Number.isFinite(liveTwdIdx) ? liveTwdIdx : item.twdIndex
              };
            });
            renderDualChart(updatedRows);
          }
          statusNote.textContent = `已同步鉅亨網公開報價（${quoteTimeStr}）；${baseStatusNote}`;
          return true;
        } catch (err) {
          renderFromSnapshot(`（API 未取得，顯示快照 ${formatClock()}）`);
          statusNote.textContent = `即時報價暂無法取得（${err.message || "連線逾時或受限"}），已保留快照數值。`;
          return false;
        } finally {
          clearTimeout(timer);
        }
      }

      renderFromSnapshot();

      refreshBtn.addEventListener("click", async () => {
        refreshBtn.disabled = true;
        refreshBtn.textContent = "抓取中...";
        await fetchLiveCnyes();
        refreshBtn.disabled = false;
        refreshBtn.textContent = "重新整理";
      });

      modeBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark");
        modeBtn.textContent = document.body.classList.contains("dark") ? "淺色" : "深色";
        renderDualChart(latestHistory10d);
      });

      document.getElementById("saveBtn").addEventListener("click", () => {
        const clone = document.documentElement.cloneNode(true);
        clone.querySelectorAll("script:not([data-keep])").forEach((el) => el.remove());
        const fileDate = /^\d{4}-\d{2}-\d{2}/.test(currentUpdated) ? currentUpdated.slice(0, 10) : "latest";
        const content = "<!DOCTYPE html>\n" + clone.outerHTML;
        const blob = new Blob([content], { type: "text/html;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `gemini-tw-index-${fileDate}.html`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
    })();
  </script>
</body>
</html>
