<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-title" content="台股戰情 Gemini 版" />
  <title>台股指數｜Gemini 獨立版</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --up: #dc2626;
      --down: #16a34a;
      --accent: #0f766e;
      --tag-bg: #ccfbf1;
      --soft-bg: #f8fafc;
    }
    body.dark {
      --bg: #0b1117;
      --card: #131c26;
      --text: #f9fafb;
      --muted: #9ca3af;
      --border: #243242;
      --up: #f87171;
      --down: #4ade80;
      --accent: #2dd4bf;
      --tag-bg: #134e4a;
      --soft-bg: #192432;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 12px 14px 44px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    button.dl {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-block;
      background: var(--tag-bg);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 12px;
      color: var(--muted);
    }
    .main-num {
      font-size: 28px;
      font-weight: 800;
      margin: 4px 0;
    }
    .up { color: var(--up); font-weight: 700; }
    .down { color: var(--down); font-weight: 700; }
    .flat { color: var(--muted); font-weight: 700; }
    .title {
      font-size: 14px;
      font-weight: 800;
      margin: 0 0 6px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 6px;
    }
    .stat-box {
      background: var(--soft-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
    }
    .stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .stat-val {
      font-size: 14px;
      font-weight: 800;
      word-break: break-word;
    }
    .stat-chg {
      font-size: 11px;
      margin-top: 2px;
    }
    .row-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      gap: 8px;
    }
    .row-item:last-child { border-bottom: none; }
    .win-box {
      background: var(--soft-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
      margin-bottom: 8px;
    }
    .win-box:last-of-type { margin-bottom: 0; }
    .win-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 3px;
    }
    .win-pct {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>台股指數（Gemini 版）</h1>
      <div class="btn-group">
        <button id="refreshBtn" type="button">重新整理</button>
        <button id="modeBtn" type="button">深色</button>
        <button id="saveBtn" class="dl" type="button">下載離線檔</button>
      </div>
    </div>

    <section class="card">
      <span class="badge">獨立並行版</span>
      <div class="sub" id="metaLine">更新：—｜基準日：—</div>
      <div class="main-num" id="idxVal">—</div>
      <div id="idxDiff" class="flat">—</div>
      <div class="sub" id="statusNote" style="margin-top:6px;"></div>
    </section>

    <section class="card">
      <div class="title" id="marginTitle">融資融券餘額與融資維持率</div>
      <div class="sub" id="marginMeta"></div>
      <div class="grid-3">
        <div class="stat-box">
          <div class="stat-label">融資餘額</div>
          <div class="stat-val" id="marginBal">—</div>
          <div class="stat-chg" id="marginBalChg">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">融券餘額</div>
          <div class="stat-val" id="shortBal">—</div>
          <div class="stat-chg" id="shortBalChg">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">融資維持率</div>
          <div class="stat-val" id="marginRatio">—</div>
          <div class="stat-chg" id="marginRatioNote">—</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="title" id="usTitle">美股與夜盤重點</div>
      <div id="usList"></div>
      <div class="sub" id="nightNote" style="margin-top:6px;"></div>
    </section>

    <section class="card">
      <div class="title">關注標的勝率追蹤（0050 / 00878 / 8086）</div>
      <div class="sub" id="winMeta" style="margin-bottom:8px;"></div>
      <div id="winList"></div>
      <div class="sub" id="winNote" style="margin-top:8px;"></div>
    </section>
  </div>

  <script id="gemini-snapshot" type="application/json" data-keep>
  {
    "version": "gemini-v1.5",
    "updated": "2026-11-25 14:13",
    "tradeDate": "2026-11-24",
    "taiexClose": 40122.35,
    "taiexPrev": 36811.89,
    "statusNote": "11/25 盤中參考約 37,972.96 點；證交所自 2026/11/24 起信用維持率追繳門檻調整為 120%。",
    "margin": {
      "date": "11/24",
      "marginBalance": null,
      "marginBalanceChg": "+196.97億",
      "shortBalance": null,
      "shortBalanceChg": "+13,656張",
      "maintenanceRatio": null,
      "thresholdNote": "追繳門檻 120%"
    },
    "usTitle": "美股與夜盤重點（11/24 美東收盤）",
    "us": [
      { "name": "道瓊工業指數", "value": "50,018.70 (+0.85%)", "dir": "up" },
      { "name": "那斯達克指數", "value": "23,733.54 (-0.48%)", "dir": "down" },
      { "name": "費城半導體指數", "value": "-7.88%", "dir": "down" }
    ],
    "nightNote": "夜盤重點：費半重挫使台指期夜盤走弱逾 1,800 點；11/24 上市融資增 196.97 億、融券增 13,656 張。",
    "winMeta": "假設持有至 12/24｜統計推估架構",
    "win": [
      {
        "code": "0050 元大台灣50",
        "winRate": null,
        "refPrice": "待排程更新",
        "range": "待 22 日對數報酬與模擬計算",
        "desc": "追蹤台灣50指數，與大盤高度連動，受權值電子與費半波動影響大。"
      },
      {
        "code": "00878 國泰永續高股息",
        "winRate": null,
        "refPrice": "待排程更新",
        "range": "待 22 日對數報酬與模擬計算",
        "desc": "高股息成分股含金融與傳產，波動通常低於純市值型標的（需納入除息調整）。"
      },
      {
        "code": "8086 宏捷科",
        "winRate": null,
        "refPrice": "待排程更新",
        "range": "待 22 日對數報酬與模擬計算",
        "desc": "砷化鎵晶圓代工族群，個股 Beta 與自有波動較高，受手機 PA 需求與美股半導體氣氛影響。"
      }
    ],
    "winNote": "統計推估僅供參考，未含交易成本與稅，不構成投資建議。"
  }
  </script>

  <script data-keep>
    (function () {
      const CNYES_QUOTE_URL = "https://ws.api.cnyes.com/ws/api/v1/quote/quotes/TWS:TSE01:INDEX";
      const metaLine = document.getElementById("metaLine");
      const idxVal = document.getElementById("idxVal");
      const idxDiff = document.getElementById("idxDiff");
      const statusNote = document.getElementById("statusNote");
      const marginMeta = document.getElementById("marginMeta");
      const marginBal = document.getElementById("marginBal");
      const marginBalChg = document.getElementById("marginBalChg");
      const shortBal = document.getElementById("shortBal");
      const shortBalChg = document.getElementById("shortBalChg");
      const marginRatio = document.getElementById("marginRatio");
      const marginRatioNote = document.getElementById("marginRatioNote");
      const usTitle = document.getElementById("usTitle");
      const usList = document.getElementById("usList");
      const nightNote = document.getElementById("nightNote");
      const winMeta = document.getElementById("winMeta");
      const winList = document.getElementById("winList");
      const winNote = document.getElementById("winNote");
      const refreshBtn = document.getElementById("refreshBtn");
      let currentUpdated = "—";
      let baseStatusNote = "";

      function formatClock(d = new Date()) {
        const hh = String(d.getHours()).padStart(2, "0");
        const mm = String(d.getMinutes()).padStart(2, "0");
        const ss = String(d.getSeconds()).padStart(2, "0");
        return `${hh}:${mm}:${ss}`;
      }

      function chgClass(str) {
        if (!str || typeof str !== "string") return "flat";
        const s = str.trim();
        if (s.startsWith("+") || s.includes("增")) return "up";
        if (s.startsWith("-") || s.includes("減")) return "down";
        return "flat";
      }

      function applyTaiex(updatedText, tradeDateText, closeVal, prevVal, extraTag = "") {
        currentUpdated = updatedText || "—";
        metaLine.textContent = `更新：${currentUpdated}｜基準日：${tradeDateText || "—"}${extraTag}`;

        const closeNum = Number(closeVal);
        const prevNum = Number(prevVal);

        if (Number.isFinite(closeNum)) {
          idxVal.textContent = closeNum.toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          });
        } else {
          idxVal.textContent = "—";
        }

        if (Number.isFinite(closeNum) && Number.isFinite(prevNum) && prevNum !== 0) {
          const diff = closeNum - prevNum;
          const pct = (diff / prevNum) * 100;
          const sign = diff > 0 ? "+" : "";
          idxDiff.textContent = `${sign}${diff.toFixed(2)} (${sign}${pct.toFixed(2)}%)`;
          idxDiff.className = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
        } else {
          idxDiff.textContent = "—";
          idxDiff.className = "flat";
        }
      }

      function renderMargin(m) {
        const data = m && typeof m === "object" ? m : {};
        marginMeta.textContent = data.date ? `資料日期：${data.date}（上市信用交易）` : "上市信用交易";

        const mBal = Number(data.marginBalance);
        marginBal.textContent = Number.isFinite(mBal) ? `${mBal.toLocaleString("en-US")} 億` : "—";
        const mChgText = data.marginBalanceChg ? `增減 ${data.marginBalanceChg}` : "增減 —";
        marginBalChg.textContent = mChgText;
        marginBalChg.className = `stat-chg ${chgClass(data.marginBalanceChg)}`;

        const sBal = Number(data.shortBalance);
        shortBal.textContent = Number.isFinite(sBal) ? `${sBal.toLocaleString("en-US")} 張` : "—";
        const sChgText = data.shortBalanceChg ? `增減 ${data.shortBalanceChg}` : "增減 —";
        shortBalChg.textContent = sChgText;
        shortBalChg.className = `stat-chg ${chgClass(data.shortBalanceChg)}`;

        const ratioNum = Number(data.maintenanceRatio);
        marginRatio.textContent = Number.isFinite(ratioNum) ? `${ratioNum.toFixed(2)}%` : "—";
        marginRatioNote.textContent = data.thresholdNote || "追繳門檻 120%";
        marginRatioNote.className = "stat-chg flat";
      }

      function renderSections(snap) {
        baseStatusNote = snap.statusNote || "";
        statusNote.textContent = baseStatusNote;

        renderMargin(snap.margin);

        usTitle.textContent = snap.usTitle || "美股與夜盤重點";
        usList.innerHTML = "";
        const usItems = Array.isArray(snap.us) ? snap.us : [];
        usItems.forEach((item) => {
          const div = document.createElement("div");
          div.className = "row-item";
          const cls = item.dir === "up" ? "up" : item.dir === "down" ? "down" : "flat";
          div.innerHTML = `<span>${item.name || "—"}</span><span class="${cls}">${item.value || "—"}</span>`;
          usList.appendChild(div);
        });
        nightNote.textContent = snap.nightNote || "";

        winMeta.textContent = snap.winMeta || "";
        winList.innerHTML = "";
        const winItems = Array.isArray(snap.win) ? snap.win : [];
        winItems.forEach((w) => {
          const box = document.createElement("div");
          box.className = "win-box";
          const rateText = (w.winRate === null || w.winRate === undefined || w.winRate === "")
            ? "待更新"
            : `${w.winRate}%`;
          box.innerHTML = `
            <div class="win-top">
              <strong>${w.code || "—"}</strong>
              <span class="win-pct">${rateText}</span>
            </div>
            <div class="sub">現價基準：${w.refPrice || "—"}｜區間：${w.range || "—"}</div>
            <div class="sub" style="margin-top:3px;">${w.desc || ""}</div>
          `;
          winList.appendChild(box);
        });
        winNote.textContent = snap.winNote || "統計推估僅供參考，未含交易成本與稅，不構成投資建議。";
      }

      function renderFromSnapshot(extraTag = "") {
        const snapEl = document.getElementById("gemini-snapshot");
        const snap = snapEl ? JSON.parse(snapEl.textContent) : {};
        renderSections(snap);
        applyTaiex(snap.updated, snap.tradeDate, snap.taiexClose, snap.taiexPrev, extraTag);
      }

      async function fetchLiveCnyes(timeoutMs = 6000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const res = await fetch(`${CNYES_QUOTE_URL}?_=${Date.now()}`, {
            signal: controller.signal,
            cache: "no-store"
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          const row = Array.isArray(json.data)
            ? json.data.find((item) => item && item["0"] === "TWS:TSE01:INDEX")
            : null;
          if (!row) throw new Error("查無 TWS:TSE01:INDEX 報價");

          const livePrice = Number(row["6"]);
          const prevClose = Number(row["21"]);
          const tickSec = Number(row["200007"]);
          if (!Number.isFinite(livePrice) || !Number.isFinite(prevClose)) {
            throw new Error("報價欄位非數值");
          }

          let quoteTimeStr = formatClock();
          if (Number.isFinite(tickSec) && tickSec > 0) {
            const d = new Date(tickSec * 1000);
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, "0");
            const dd = String(d.getDate()).padStart(2, "0");
            quoteTimeStr = `${yyyy}-${mm}-${dd} ${formatClock(d)}`;
          }

          applyTaiex(quoteTimeStr, "即時報價", livePrice, prevClose, `（鉅亨網即時 ${formatClock()}）`);
          statusNote.textContent = `已同步鉅亨網公開報價（${quoteTimeStr}）；${baseStatusNote}`;
          return true;
        } catch (err) {
          renderFromSnapshot(`（API 未取得，顯示快照 ${formatClock()}）`);
          statusNote.textContent = `即時報價暂無法取得（${err.message || "連線逾時或受限"}），已保留快照數值。`;
          return false;
        } finally {
          clearTimeout(timer);
        }
      }

      renderFromSnapshot();

      refreshBtn.addEventListener("click", async () => {
        refreshBtn.disabled = true;
        refreshBtn.textContent = "抓取中...";
        await fetchLiveCnyes();
        refreshBtn.disabled = false;
        refreshBtn.textContent = "重新整理";
      });

      const modeBtn = document.getElementById("modeBtn");
      modeBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark");
        modeBtn.textContent = document.body.classList.contains("dark") ? "淺色" : "深色";
      });

      document.getElementById("saveBtn").addEventListener("click", () => {
        const clone = document.documentElement.cloneNode(true);
        clone.querySelectorAll("script:not([data-keep])").forEach((el) => el.remove());
        const fileDate = /^\d{4}-\d{2}-\d{2}/.test(currentUpdated) ? currentUpdated.slice(0, 10) : "latest";
        const content = "<!DOCTYPE html>\n" + clone.outerHTML;
        const blob = new Blob([content], { type: "text/html;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `gemini-tw-index-${fileDate}.html`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
    })();
  </script>
</body>
</html>
